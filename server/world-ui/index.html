<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界观察 · 数字生命</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b26; --line: #262d3d;
    --text: #dde4f0; --dim: #8a93a8;
    --accent: #5eead4; --warn: #f0b429; --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; overflow: hidden;
  }
  #main {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 20px;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: 2px; font-weight: 600; }
  h1 span { color: var(--accent); }
  #hud { display: flex; gap: 20px; font-size: 13px; color: var(--dim); flex-wrap: wrap; justify-content: center; }
  #hud b { color: var(--text); font-weight: 600; }
  canvas {
    background: #0b0e15; border: 1px solid var(--line); border-radius: 10px;
    max-width: 94vw; max-height: 62vh;
  }
  #legend { display: flex; gap: 16px; font-size: 12px; color: var(--dim); flex-wrap: wrap; justify-content: center; }
  #side {
    width: 330px; min-width: 330px; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; background: var(--panel);
  }
  #side h2 { font-size: 14px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  #log {
    flex: 1; overflow-y: auto; padding: 10px 16px; font-size: 13px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .ev { padding: 8px 10px; background: #1b2231; border-radius: 8px; border-left: 3px solid var(--accent); }
  .ev .t { color: var(--dim); font-size: 11px; margin-bottom: 3px; }
  .ev.stone_hit { border-left-color: var(--danger); }
  .ev.eat { border-left-color: var(--warn); }
  #side .foot { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<div id="main">
  <h1>🌍 世界观察 <span>·</span> 数字生命</h1>
  <div id="hud">
    <div>时钟 <b id="tick">–</b></div>
    <div>下次事件 <b id="next">–</b>s</div>
    <div>物品 <b id="items">–</b></div>
    <div>生命 <b id="ents">–</b></div>
  </div>
  <canvas id="map" width="560" height="560"></canvas>
  <div id="legend">
    <span>🍰 蛋糕</span><span>🌸 花朵</span><span>🟤 臭泥</span>
    <span>🪨 石头</span><span>🌳 果树</span><span>💧 水</span>
    <span style="color:var(--accent)">◉ 数字生命（含 z 高度）</span>
    <span style="color:var(--warn)">▢ 被拿起的物品</span>
  </div>
</div>
<div id="side">
  <h2>📜 事件日志</h2>
  <div id="log"><div class="ev"><div class="t">–</div>连接中……</div></div>
  <div class="foot">每 2 秒轮询 /state · 世界服务端口 9631</div>
</div>
<script>
  const CELL = 14
  const EMOJI = { cake: '🍰', flower: '🌸', rotten: '🟤', stone: '🪨', fruit: '🌳', water: '💧' }
  const $ = (id) => document.getElementById(id)
  const canvas = $('map')
  const ctx = canvas.getContext('2d')

  function drawMap(st) {
    const n = st.mapSize || 40
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    // 网格
    ctx.strokeStyle = '#1c2330'
    ctx.lineWidth = 1
    for (let i = 0; i <= n; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL + 0.5, 0); ctx.lineTo(i * CELL + 0.5, canvas.height); ctx.stroke()
      ctx.beginPath(); ctx.moveTo(0, i * CELL + 0.5); ctx.lineTo(canvas.width, i * CELL + 0.5); ctx.stroke()
    }
    // 出生点标记（地图中心）
    ctx.strokeStyle = 'rgba(94,234,212,0.35)'
    ctx.strokeRect(20 * CELL + 2, 20 * CELL + 2, CELL - 4, CELL - 4)
    // 物品
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.font = '12px serif'
    for (const it of st.items || []) {
      const cx = it.pos.x * CELL + CELL / 2
      const cy = it.pos.y * CELL + CELL / 2
      ctx.fillText(EMOJI[it.type] || '❓', cx, cy + 1)
      if (it.heldBy) {
        ctx.strokeStyle = '#f0b429'
        ctx.strokeRect(it.pos.x * CELL + 2, it.pos.y * CELL + 2, CELL - 4, CELL - 4)
      }
    }
    // 数字生命（位置 + z 高度）
    for (const e of Object.values(st.entities || {})) {
      const cx = e.pos.x * CELL + CELL / 2
      const cy = e.pos.y * CELL + CELL / 2
      ctx.beginPath()
      ctx.arc(cx, cy, CELL * 0.62, 0, Math.PI * 2)
      ctx.fillStyle = 'rgba(94,234,212,0.15)'
      ctx.fill()
      ctx.strokeStyle = '#5eead4'
      ctx.stroke()
      ctx.font = '12px serif'
      ctx.fillStyle = '#dde4f0'
      ctx.fillText('👤', cx, cy + 1)
      ctx.font = '9px sans-serif'
      ctx.fillStyle = '#8a93a8'
      ctx.fillText('z=' + e.pos.z, cx, cy - CELL * 0.78)
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  }

  function fmtTime(ts) {
    if (!ts) return '–'
    const d = new Date(ts)
    return d.toLocaleTimeString('zh-CN', { hour12: false })
  }

  function renderLog(st) {
    const logEl = $('log')
    const evs = (st.worldEvents || []).slice(-60).reverse()
    if (evs.length === 0) {
      logEl.innerHTML = '<div class="ev"><div class="t">–</div>还没有事件</div>'
      return
    }
    logEl.innerHTML = evs
      .map((ev) => `<div class="ev ${esc(ev.type)}"><div class="t">${fmtTime(ev.ts)}</div>${esc(ev.text)}</div>`)
      .join('')
  }

  async function poll() {
    try {
      const res = await fetch('/state')
      const st = await res.json()
      $('tick').textContent = st.tick
      $('next').textContent = st.nextEventIn
      $('items').textContent = (st.items || []).length
      $('ents').textContent = Object.keys(st.entities || {}).length
      drawMap(st)
      renderLog(st)
    } catch {
      /* 连接中断：保留旧画面 */
    }
    setTimeout(poll, 2000)
  }
  poll()
</script>
</body>
</html>
