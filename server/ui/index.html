<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>可塑性记忆 · 聊天窗口</title>
<style>
  :root {
    --bg: #1e2129;
    --bg-panel: #262a33;
    --bg-bubble: #2b303b;
    --bg-input: #262a33;
    --border: #343a47;
    --text: #e6e9f0;
    --text-dim: #9aa3b5;
    --accent: #7aa2f7;
    --user-bubble: #4664e8;
    --warn: #ffd166;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3a4050; border-radius: 4px; }

  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ===== 顶栏 ===== */
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 10px 16px;
    background: var(--bg-panel); border-bottom: 1px solid var(--border);
  }
  .top-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar-lg { font-size: 30px; line-height: 1; }
  .life-name { font-size: 17px; font-weight: 600; }
  .badges { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: #2f3541; color: var(--text-dim); border: 1px solid var(--border);
    white-space: nowrap;
  }
  .badge.train { color: #8fd6a1; border-color: #2f5c43; background: #24362c; }
  .badge.frozen { color: #9cc2ff; border-color: #33466b; background: #242c3d; }
  .badge.sleeping { color: #c9b8f5; border-color: #4a3d6b; background: #2c2640; }
  .badge.err { color: var(--warn); border-color: #6b5a33; background: #332e22; }
  .melatonin { display: flex; align-items: center; gap: 8px; min-width: 200px; }
  .melatonin .label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .bar { flex: 1; height: 8px; background: #333846; border-radius: 4px; overflow: hidden; }
  .bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #7c6ff0, #a58bf5);
    border-radius: 4px; transition: width .6s ease;
  }
  .melatonin .val { font-size: 12px; color: var(--text-dim); width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ===== 主布局 ===== */
  #layout { flex: 1; display: flex; min-height: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 18px 20px; scroll-behavior: smooth; }
  #messages { display: flex; flex-direction: column; gap: 12px; }

  /* ===== 消息气泡 ===== */
  .msg { display: flex; align-items: flex-end; gap: 8px; animation: pop .25s ease; }
  .msg.user { flex-direction: row-reverse; }
  .msg .avatar { font-size: 22px; flex: none; width: 30px; text-align: center; }
  .msg .bubble {
    max-width: 68%; padding: 10px 14px; border-radius: 14px;
    background: var(--bg-bubble); line-height: 1.6; font-size: 14px;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
  .msg.life .bubble { border-bottom-left-radius: 4px; }
  .msg.system { justify-content: center; }
  .msg.system .bubble {
    background: transparent; border: 1px dashed var(--border);
    color: var(--text-dim); font-size: 13px;
  }
  .msg .meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; opacity: .8; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* 思考中占位 */
  .thinking .dots span { display: inline-block; animation: blink 1.2s infinite; }
  .thinking .dots span:nth-child(2) { animation-delay: .2s; }
  .thinking .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* ===== 右侧窄栏 ===== */
  #sidebar {
    width: 260px; flex: none; overflow-y: auto;
    border-left: 1px solid var(--border); background: var(--bg-panel);
    padding: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .card h3 { font-size: 12px; color: var(--text-dim); font-weight: 600; margin-bottom: 8px; letter-spacing: .5px; }
  .row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
  .row:last-child { margin-bottom: 0; }
  .row .k { color: var(--text-dim); }
  .row .v { font-variant-numeric: tabular-nums; }
  .meter { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 7px; }
  .meter:last-child { margin-bottom: 0; }
  .meter .k { width: 74px; color: var(--text-dim); flex: none; }
  .meter .v { width: 34px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  .mol-grid .mini { font-size: 11px; color: var(--text-dim); display: inline-block; margin: 0 8px 4px 0; }

  /* ===== 输入区 ===== */
  #inputbar { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--bg-panel); }
  #input {
    flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 14px; padding: 10px 14px; outline: none;
    transition: border-color .15s;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    border: none; border-radius: 10px; padding: 0 22px; font-size: 14px; cursor: pointer;
    background: var(--user-bubble); color: #fff; transition: filter .15s;
  }
  #send:hover { filter: brightness(1.15); }
  #send:disabled { opacity: .5; cursor: not-allowed; }

  /* ===== 顶部提示条 ===== */
  #toast {
    position: fixed; top: 70px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #2c2a1d; border: 1px solid #6b5a33; color: var(--warn);
    padding: 8px 18px; border-radius: 999px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .3s ease; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 引导遮罩 ===== */
  #guide {
    position: fixed; inset: 0; background: rgba(20, 22, 28, .92);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  #guide.hidden { display: none; }
  #guide .box { max-width: 430px; text-align: center; padding: 34px 30px; }
  #guide .emoji { font-size: 52px; }
  #guide h2 { font-size: 18px; margin: 14px 0 10px; }
  #guide p { font-size: 13px; color: var(--text-dim); line-height: 1.9; }
  #guide button {
    margin-top: 18px; border: 1px solid var(--accent); background: transparent; color: var(--accent);
    border-radius: 10px; padding: 8px 26px; font-size: 13px; cursor: pointer;
  }
  #guide button:hover { background: rgba(122, 162, 247, .12); }

  @media (max-width: 900px) {
    #sidebar { display: none; }
    .msg .bubble { max-width: 82%; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="top-left">
      <div class="avatar-lg">🧠</div>
      <div>
        <div id="lifeName" class="life-name">数字生命</div>
        <div id="badges" class="badges">
          <span class="badge" id="badgeMode">连接中…</span>
          <span class="badge" id="badgeSleep">—</span>
          <span class="badge err" id="badgeErr">预测误差 —</span>
        </div>
      </div>
    </div>
    <div class="melatonin">
      <span class="label">褪黑素</span>
      <div class="bar"><i id="melatoninFill"></i></div>
      <span class="val" id="melatoninText">--</span>
    </div>
  </header>
  <div id="toast">☀ 它醒来了</div>
  <div id="layout">
    <main id="chat"><div id="messages"></div></main>
    <aside id="sidebar">
      <div class="card">
        <h3>情绪</h3>
        <div class="meter"><span class="k">效价</span><span class="bar"><i id="mValence"></i></span><span class="v" id="vValence">--</span></div>
        <div class="meter"><span class="k">唤醒</span><span class="bar"><i id="mArousal"></i></span><span class="v" id="vArousal">--</span></div>
      </div>
      <div class="card">
        <h3>分子浓度</h3>
        <div id="molList"></div>
        <div id="molMini" class="mol-grid"></div>
      </div>
      <div class="card">
        <h3>存储 / 状态</h3>
        <div class="row"><span class="k">感知观察</span><span class="v" id="sObserve">--</span></div>
        <div class="row"><span class="k">分析存档</span><span class="v" id="sStore">--</span></div>
        <div class="row"><span class="k">待处理感知</span><span class="v" id="sPending">--</span></div>
        <div class="row"><span class="k">镜像同步</span><span class="v" id="sMirror">--</span></div>
        <div class="row"><span class="k">缺陷人格</span><span class="v" id="sFlaw">--</span></div>
        <div class="row"><span class="k">扩展网络</span><span class="v" id="sExt">--</span></div>
      </div>
      <div class="card">
        <h3>睡眠</h3>
        <div class="row"><span class="k">状态</span><span class="v" id="pAsleep">--</span></div>
        <div class="row"><span class="k">清醒度</span><span class="v" id="pWake">--</span></div>
        <div class="row"><span class="k">睡眠次数</span><span class="v" id="pCount">--</span></div>
        <div class="row"><span class="k">最近醒来</span><span class="v" id="pLastWake">--</span></div>
      </div>
    </aside>
  </div>
  <footer id="inputbar">
    <input id="input" type="text" placeholder="对它说点什么…（Enter 发送）" autocomplete="off">
    <button id="send">发送</button>
  </footer>
</div>
<div id="guide" class="hidden">
  <div class="box">
    <div class="emoji">🧠</div>
    <h2>可塑性记忆尚未初始化</h2>
    <p id="guideText">请先在 DSH 侧边栏打开「可塑性记忆」面板并初始化工作区。<br>初始化完成后本页面会自动连接。</p>
    <button id="retry">重新连接</button>
  </div>
</div>
<script>
'use strict'
/* ===== 全局状态 ===== */
let lastWakeAt = null
let sending = false
let thinkingEl = null
let pollTimer = null
let introDone = false

const $ = (id) => document.getElementById(id)
const messagesEl = $('messages')

/* ===== 工具 ===== */
function fmt(v, d = 2) {
  const n = Number(v)
  return Number.isFinite(n) ? n.toFixed(d) : '--'
}
function clamp01(v) {
  const n = Number(v)
  return Number.isFinite(n) ? Math.max(0, Math.min(1, n)) : 0
}
function barEl(el, ratio) {
  el.style.width = (clamp01(ratio) * 100).toFixed(1) + '%'
}

/* ===== API ===== */
async function fetchStatus() {
  const res = await fetch('/api/status')
  return res.json()
}
async function controller(action, payload) {
  const res = await fetch('/api/controller', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, payload: payload ?? {} }),
  })
  return res.json()
}

/* ===== 消息流（气泡渲染） ===== */
function addMessage(role, text, meta) {
  const wrap = document.createElement('div')
  wrap.className = 'msg ' + role
  if (role === 'life') {
    const av = document.createElement('div')
    av.className = 'avatar'
    av.textContent = '🧠'
    wrap.appendChild(av)
  }
  const bubble = document.createElement('div')
  bubble.className = 'bubble'
  bubble.textContent = String(text ?? '')
  if (meta && role === 'life' && meta.moodTag) {
    const m = document.createElement('div')
    m.className = 'meta'
    m.textContent = '情绪 · ' + meta.moodTag
    bubble.appendChild(m)
  }
  wrap.appendChild(bubble)
  messagesEl.appendChild(wrap)
  scrollBottom()
  return bubble
}
function addUserMessage(text) { return addMessage('user', text) }
function addLifeMessage(text, meta) { return addMessage('life', text, meta) }
function addSystemMessage(text) { return addMessage('system', text) }
function showThinking() {
  if (thinkingEl) return
  const wrap = document.createElement('div')
  wrap.className = 'msg life thinking'
  const av = document.createElement('div')
  av.className = 'avatar'
  av.textContent = '🧠'
  wrap.appendChild(av)
  const bubble = document.createElement('div')
  bubble.className = 'bubble'
  bubble.innerHTML = '思考中<span class="dots"><span>.</span><span>.</span><span>.</span></span>'
  wrap.appendChild(bubble)
  messagesEl.appendChild(wrap)
  thinkingEl = wrap
  scrollBottom()
}
function hideThinking() {
  if (thinkingEl) { thinkingEl.remove(); thinkingEl = null }
}
function scrollBottom() {
  const chat = document.getElementById('chat')
  chat.scrollTop = chat.scrollHeight
}

/* ===== 发送 ===== */
async function sendMessage() {
  const input = $('input')
  const text = input.value.trim()
  if (!text || sending) return
  input.value = ''
  addUserMessage(text)
  showThinking()
  sending = true
  $('send').disabled = true
  try {
    const res = await controller('speak', { text })
    hideThinking()
    const result = res && res.result ? res.result : null
    if (res && res.ok && result && typeof result.text === 'string') {
      addLifeMessage(result.text, result)
    } else {
      addLifeMessage('（它没有回应……）')
    }
  } catch (e) {
    hideThinking()
    addLifeMessage('（连接中断了，请稍后再试）')
  } finally {
    sending = false
    $('send').disabled = false
    $('input').focus()
  }
}

/* ===== 初始主动发言 ===== */
async function runIntro() {
  if (introDone) return
  introDone = true
  showThinking()
  try {
    const res = await controller('speak', {})
    hideThinking()
    if (res && res.ok && res.result && typeof res.result.text === 'string') {
      addLifeMessage(res.result.text, res.result)
    } else {
      addLifeMessage('（我在这里……）')
    }
  } catch (e) {
    hideThinking()
    addLifeMessage('（我还在慢慢醒来……）')
  }
}

/* ===== 状态渲染 ===== */
function renderStatus(s) {
  if (!s) return
  if (s.name) $('lifeName').textContent = s.name
  /* 徽章：训练/冻结态 */
  const modeBadge = $('badgeMode')
  const frozenMode = String(s.mode || '').includes('frozen') || (s.flaw && s.flaw.frozen === true)
  modeBadge.textContent = frozenMode ? '🧊 冻结态' : '🔥 训练态'
  modeBadge.className = 'badge ' + (frozenMode ? 'frozen' : 'train')
  /* 徽章：睡眠/清醒 */
  const sleep = s.sleep || {}
  const sleepBadge = $('badgeSleep')
  if (sleep.asleep) {
    sleepBadge.textContent = '😴 休眠中'
    sleepBadge.className = 'badge sleeping'
  } else {
    sleepBadge.textContent = '清醒 ' + Math.round(clamp01(sleep.wakefulness) * 100) + '%'
    sleepBadge.className = 'badge'
  }
  /* 徽章：预测误差 */
  const mem = s.memory || {}
  $('badgeErr').textContent = '预测误差 ' + fmt(mem.predErrorEma, 3)
  /* 褪黑素进度条 */
  const mel = clamp01(sleep.melatoninProgress)
  barEl($('melatoninFill'), mel)
  $('melatoninText').textContent = Math.round(mel * 100) + '%'
  /* 情绪条 */
  const emo = s.emotion || {}
  const valence = emo.valence
  const arousal = emo.arousal
  barEl($('mValence'), Number.isFinite(valence) ? (valence + 1) / 2 : 0)
  barEl($('mArousal'), arousal)
  $('vValence').textContent = fmt(valence, 2)
  $('vArousal').textContent = fmt(arousal, 2)
  /* 分子浓度：主要 6 种 + 其余 9 种 */
  const molecules = (s.endocrine && s.endocrine.molecules) || {}
  const MAIN = [
    ['dopamine', '多巴胺'],
    ['cortisol', '皮质醇'],
    ['oxytocin', '催产素'],
    ['testosterone', '睾酮'],
    ['serotonin', '血清素'],
    ['melatonin', '褪黑素'],
  ]
  const MINOR = {
    noradrenaline: '去甲肾上腺素', adrenaline: '肾上腺素', estrogen: '雌激素',
    progesterone: '孕激素', endorphin: '内啡肽', acetylcholine: '乙酰胆碱',
    gaba: 'GABA', glutamate: '谷氨酸', prolactin: '催乳素',
  }
  let molHtml = ''
  for (const pair of MAIN) {
    const id = pair[0]
    const lv = molecules[id] && Number.isFinite(molecules[id].level) ? clamp01(molecules[id].level) : 0
    molHtml += '<div class="meter"><span class="k">' + pair[1] + '</span><span class="bar"><i style="width:' + (lv * 100).toFixed(1) + '%"></i></span><span class="v">' + fmt(lv, 2) + '</span></div>'
  }
  $('molList').innerHTML = molHtml
  let mini = ''
  for (const id of Object.keys(MINOR)) {
    const lv = molecules[id] && Number.isFinite(molecules[id].level) ? fmt(molecules[id].level, 2) : '--'
    mini += '<span class="mini">' + MINOR[id] + ' ' + lv + '</span>'
  }
  $('molMini').innerHTML = mini
  /* 存储 / 状态 */
  $('sObserve').textContent = fmt(mem.observeCount, 0)
  $('sStore').textContent = fmt(s.analysis && s.analysis.storeCount, 0)
  $('sPending').textContent = fmt(s.pendingCount, 0)
  const synced = s.mirror && s.mirror.synced
  $('sMirror').textContent = synced === true ? '✔ 已同步' : synced === false ? '⚠ 未同步' : '--'
  $('sFlaw').textContent = s.flaw && s.flaw.frozen ? '冻结' : '训练'
  const ext = Array.isArray(s.extensions) ? s.extensions : []
  $('sExt').textContent = String(ext.length)
  /* 睡眠卡 */
  $('pAsleep').textContent = sleep.asleep ? '😴 休眠中' : '☀ 清醒'
  $('pWake').textContent = Math.round(clamp01(sleep.wakefulness) * 100) + '%'
  $('pCount').textContent = fmt(sleep.sleepCount, 0)
  $('pLastWake').textContent = sleep.lastWakeAt ? new Date(sleep.lastWakeAt).toLocaleTimeString('zh-CN') : '--'
  /* 醒来提示：lastWakeAt 变化 → 顶部提示条 */
  if (sleep.lastWakeAt !== undefined && sleep.lastWakeAt !== null) {
    if (lastWakeAt !== null && lastWakeAt !== sleep.lastWakeAt && !sleep.asleep) {
      showToast('☀ 它醒来了')
    }
    lastWakeAt = sleep.lastWakeAt
  }
}

/* ===== 提示条 ===== */
let toastTimer = null
function showToast(text) {
  const t = $('toast')
  t.textContent = text
  t.classList.add('show')
  if (toastTimer) clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('show'), 4000)
}

/* ===== 引导 ===== */
function showGuide(text) {
  const g = $('guide')
  if (text) $('guideText').innerHTML = text
  g.classList.remove('hidden')
}
function hideGuide() { $('guide').classList.add('hidden') }

/* ===== 启动 / 轮询 ===== */
async function boot() {
  addSystemMessage('正在连接可塑性记忆服务…')
  let status = null
  try {
    status = await fetchStatus()
  } catch (e) {
    status = null
  }
  if (!status || status.ok === false || status.initialized === false) {
    showGuide('无法连接到服务，或工作区尚未初始化。<br>请确认独立服务已启动（HTTP 端口 9630），并先在 DSH 侧边栏初始化工作区。')
    startPolling()
    return
  }
  hideGuide()
  renderStatus(status)
  startPolling()
  runIntro()
}

function startPolling() {
  if (pollTimer) return
  pollTimer = setInterval(async () => {
    try {
      const s = await fetchStatus()
      if (!s || s.ok === false || s.initialized === false) { showGuide(); return }
      hideGuide()
      if (!introDone) runIntro()
      renderStatus(s)
    } catch (e) {
      /* 轮询失败静默，等待下次 */
    }
  }, 2000)
}

/* ===== 事件 ===== */
$('send').addEventListener('click', sendMessage)
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendMessage() }
})
$('retry').addEventListener('click', () => { location.reload() })

boot()
</script>
</body>
</html>
